[/Script/Engine.GameNetworkManager]
; How long the host waits without moves from a player before it moves them itself (Unreal's guard
; against lag switches). The default 0.25 s fires whenever a joiner's game stalls (loading, garbage
; collection, shader compiles, a screenshot): the host then pushes that player's clock ahead and throws
; away their real moves for as long as the stall lasted. 2 s suits LAN co-op; revisit for PvP.
MAXCLIENTUPDATEINTERVAL=2.0
