[/Script/Engine.RendererSettings]
; Nanite off on the Mac: on Apple GPUs (measured on an M4, -WWOPerfTest -WWOPerfSweep) Nanite's own
; fixed passes cost about 3 ms a frame more than drawing these maps as ordinary meshes. Nanite
; meshes draw their fallback instead, which Tools/enable_nanite.py keeps at full detail. Other
; platforms keep Nanite. Re-measure if the maps get much heavier.
r.Nanite=0
; Cascaded shadow maps instead of virtual ones on the Mac: with Nanite off, the virtual shadow maps
; cost about 3 ms a frame in a moving 12-player match at 1440p and the cascades about 0.5 ms, for
; the same picture on these maps (side-by-side shots, 2026-11-12).
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxCSMResolution=2048
