[/Script/Engine.UserInterfaceSettings]
; Godot's canvas_items stretch with aspect "expand" on a 1600 x 900 base: the UI scales by
; min(width / base width, height / base height). Menus are laid out in 1920 x 1080 units (1.2x).
UIScaleRule=ScaleToFit
DesignScreenSize=(X=1920,Y=1080)

[SystemSettings]
; Lower input latency: the game thread waits for the previous frame to reach the RHI (instead of
; running up to three frames ahead of the screen), and rendering does not trail the game by a frame.
; The game thread uses only ~1.5 ms a frame, so this costs little.
r.GTSyncType=1
r.OneFrameThreadLag=0

[OnlineSubsystem]
; LAN sessions (host / find / join on the local network) through the Null online subsystem.
DefaultPlatformService=Null
