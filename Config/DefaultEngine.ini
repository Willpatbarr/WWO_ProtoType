[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/WWO/Maps/L_Arena.L_Arena
GameDefaultMap=/Game/WWO/Maps/L_Arena.L_Arena
TransitionMap=
GlobalDefaultGameMode=/Script/WhatWasOurs.WWOGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; No Lumen: the arenas are lit by one sun and a sky light, and Godot's ambient was never shadowed.
; Lumen cost about 15 ms of GPU a frame on an M4 for little visible gain (see -WWOPerfTest).
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
; The unshadowed point lights (the Arboretum has 59) are shaded together in one pass instead of one
; full-screen pass each: about 7 ms of GPU a frame saved there on an M4, same picture (-WWOProfileGPU).
; (UE 5.7 renamed the setting and plans to remove it; if a later engine drops it, cut the light count or radii instead.)
r.UseClusteredDeferredShading_ToBeRemoved=1
; TAA instead of TSR: TSR cost about 4.5 ms of GPU a frame on an M4.
r.AntiAliasingMethod=2
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.DefaultFeature.MotionBlur=False
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.CustomDepth=3

[/Script/MacTargetPlatform.MacTargetSettings]
; Both: Macs that can't run SM6 (the M1 MacBook Air on macOS 26 falls back to SM5) need SM5 shaders,
; or the build stops at startup with "Shader platform SF_METAL_SM5 was not cooked".
+TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
; Mac mobile renderer build: the app starts with -FeatureLevelES31 (baked in by Tools/package_mac.sh, WWO_CMDLINE).
+TargetedRHIs=SF_METAL_ES3_1

[/Script/MacTargetPlatform.XcodeProjectSettings]
